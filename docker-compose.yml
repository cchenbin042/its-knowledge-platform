services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: its-postgres
    environment:
      POSTGRES_DB: its_knowledge
      POSTGRES_USER: its_user
      POSTGRES_PASSWORD: its_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U its_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: its-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: its-platform
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      LLM_BASE_URL: https://api.siliconflow.cn/v1
      LLM_API_KEY: sk-vixtfoqugjjzvzhiydapwvfoxgadbcstzxpecupygtgnrmgt
      LLM_EMBEDDING_MODEL: Pro/BAAI/bge-m3
      LLM_CHAT_MODEL: deepseek-ai/DeepSeek-V4-Flash
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/its_knowledge
      SPRING_DATASOURCE_USERNAME: its_user
      SPRING_DATASOURCE_PASSWORD: its_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/documents"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data: