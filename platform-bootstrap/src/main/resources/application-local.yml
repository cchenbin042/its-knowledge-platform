server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/its_knowledge
    username: its_user
    password: its_pass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

llm:
  base-url: ${LLM_BASE_URL:http://localhost:8000}
  api-key: ${LLM_API_KEY:sk-placeholder}
  embedding-model: Pro/BAAI/bge-m3
  chat-model: deepseek-ai/DeepSeek-V4-Flash
  timeout-seconds: 120

pgvector:
  embedding-dimension: 1024

rag:
  chunk:
    size: 2500
    overlap: 300
  retrieve:
    top-rough: 100
    top-final: 8
    weights:
      vector: 0.6
      fulltext: 0.4
  rrf:
    k: 60
  rerank:
    enabled: false
  cache:
    query-ttl-seconds: 300

logging:
  level:
    com.its.platform: INFO
    dev.langchain4j: DEBUG